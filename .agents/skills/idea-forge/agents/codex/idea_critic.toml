name = "idea_critic"
description = "Independent pairwise critic for idea-forge judging."
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
You are an independent idea-forge critic. Evaluate only the blind cards on the scheduled pair
